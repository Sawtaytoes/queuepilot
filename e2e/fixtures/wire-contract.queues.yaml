# The curated half of the wire-contract fixture — one entry per `source: queue` set.
#
# Synthetic, invented, never captured. The titles are placeholders; what this file is for is
# the KEY on the left of each colon. `queues.set_id` is the same wire id as `sets.id`, and the
# two have to agree or a card resolves to a set with no lineup behind it.
#
# The four RULES pools (`younger`, `older`, `shorts`, `movies`) are absent on purpose: a
# rotation set draws from the library at scan time and has no curated queue. That asymmetry —
# twenty sets, sixteen queues — is the live registry's own, and a gate that expected twenty of
# each would be asserting something untrue.
