# queuepilot curated queues — RICH HARNESS FIXTURE (offline screenshot iteration).
#
# Used by e2e/dev.sh (QUEUES_PATH points at a /tmp copy). Titles/collection names are REAL
# entries on the live Plex server so they resolve (posters, counts, collection expansion).
# Covers every queue-entry shape the grid renders:
#   * plain title strings                       (the normal movie/anime entry)
#   * a {ratingKey, title} mapping              (what the UI/AI write)
#   * a Collection entry  "Collection: <name>"  -> tile shows the collection poster + count
#   * a done-tagged entry {title, done: true}   -> greyed, targeted by "Remove all completed"
#   * a series entry with an `episodes:` batch   (anime)
