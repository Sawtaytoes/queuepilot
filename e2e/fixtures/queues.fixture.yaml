# queuepilot curated queues -- Bob's per-audience wishlists (top = plays next).
#
# Edit by hand here, over SMB (\\nas.example.com\App-Configs\plex-channels\queues.yaml),
# or in the web UI (plex-channels.example.com). Order = play order, TOP plays next. A MOVIE
# plays once and drops off when watched; a SERIES plays its next unwatched episodes in
# order and drops off when fully watched. Finished entries are auto-removed on each scan.
#
# ENTRY FORMAT (decision 2026-08-21-a-queue-entry-is-an-object-and-carries-its-rating-key.md).
# EVERY entry is a MAPPING. A bare string is not read any more.
#     - {ratingKey: "459608", title: "Duel (1971)"}   # an item — the normal form
#     - {title: "86 Eighty-Six (2021) [anidb-16172]"} # a title with no key yet; still resolved
#     - {collection: "Godzilla Collection"}           # a collection, resolved by NAME
# A hand-added entry may still be typed as `- {title: "Duel (1971)"}` with no key: it resolves
# at scan time against the card's sections (movies=1, anime=11), and the web UI writes the key
# back when it adds one. A title that matches nothing is kept + flagged, never dropped and
# never rewritten -- fix the title/year.
#
# SEEDED 2026-07-20 from Bob's Plex Watchlist (73) + On Deck, best-guess by audience --
# REARRANGE FREELY. Mapping used:
#   * movies routed by contentRating: G/PG -> family (Family), everything else -> bob.
#   * couple picks aren't inferable, so bob_alice / bob_alice_anime were left EMPTY.
#   * every Watchlist "movie" (incl. anime films like Jin-Roh, Steamboy) lives in the
#     Movies section, so they all landed in the movie queues; the anime queues were seeded
#     from On Deck (Continue Watching) shows in the Anime section.
#   * bob_anime excludes Dragon Ball Z + Daemons of the Shadow Realm (Bob's recorded
#     anime exclusions); no On Deck show was clearly kid-anime, so family_anime is EMPTY.
#   * "# not in library yet" = a Watchlist wish not currently in Plex; it's skipped at scan
#     until it's added (kept here so the wishlist is complete).

# QUEUE KEY -> AUDIENCE (per-set '# Plex: ...' labels were removed 2026-07-20: they drifted
# on every edit and only duplicated this. The web UI and NFC cards key off the names below,
# NOT these comments):
#   bob               = Bob - Movies
#   bob_alice        = Bob & Alice - Movies
#   family          = Family - Movies (G/PG)
#   bob_anime         = Bob - Anime
#   bob_alice_anime  = Bob & Alice - Anime
#   family_anime    = Family - Anime

