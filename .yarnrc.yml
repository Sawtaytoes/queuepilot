approvedGitRepositories:
  - "**"

enableScripts: true

# Each workspace keeps its OWN node_modules; nothing hoists across them.
#
# web/, server/ and e2e/ are three different runtimes (a browser bundle, a Node server, a
# test harness) that happen to share a repo, and under npm they had three isolated installs.
# Full hoisting silently re-pointed the SERVER's tsc at web's `@types/react@19`, and satori's
# `ReactNode` parameter then failed to typecheck against a React the server does not use and
# does not declare. That is the whole class of bug this setting closes: a dependency one
# workspace never asked for changing how another one compiles.
nmHoistingLimits: workspaces

nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.14.1.cjs
