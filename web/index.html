<!doctype html>
<!-- The Charcuterie axes live on `<html>`.

     `data-scheme` is NOT hardcoded here any more: the app follows the OS light/dark
     scheme (and a persisted override via `<ColorSchemeSwitcher>`). An inline
     first-paint script — injected head-prepend by the `firstPaint` Vite plugin from
     `@charcuterie/tokens`' `buildFirstPaintScript(daylight)` — sets `data-scheme`
     AND the anti-flash background from the resolved choice before the first frame,
     so there is no flash and no second source of truth to keep in sync. See
     `vite/firstPaint.ts` and the guard in `src/firstPaintColour.test.ts`.

     `data-variant` is omitted deliberately — `daylight` is the default and `:root`
     carries it, so naming it here would be a second place to change if the fleet
     ever moves. -->
<html
  lang="en"
  data-density="comfortable"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QueuePilot</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
