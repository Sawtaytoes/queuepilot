<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 770" role="img" aria-labelledby="title description">
  <title id="title">How QueuePilot starts a temporary Plex play queue on Android TV</title>
  <desc id="description">Five steps: QueuePilot selects items, Plex Media Server builds a temporary play queue, Plex returns its ID, QueuePilot sends the ID through Plex Companion, and the Plex app plays the queue. ADB can control the Shield separately.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M1 1 L5 5 L1 9" fill="none" stroke="#596779" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="798" height="768" rx="20" fill="#ffffff" stroke="#d6deea" stroke-width="2"/>
  <text x="40" y="49" fill="#182536" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">How QueuePilot starts Plex playback</text>
  <text x="40" y="78" fill="#526176" font-family="Arial, Helvetica, sans-serif" font-size="17">Temporary play queue on a Shield or Android TV</text>

  <rect x="40" y="100" width="720" height="94" rx="14" fill="#eaf1ff" stroke="#aac3f0" stroke-width="2"/>
  <circle cx="79" cy="147" r="23" fill="#275db4"/>
  <text x="79" y="154" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">1</text>
  <text x="120" y="139" fill="#182536" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">QueuePilot selects the items</text>
  <text x="120" y="169" fill="#40536b" font-family="Arial, Helvetica, sans-serif" font-size="17">It shuffles or orders episodes and movies.</text>
  <path d="M400 197 V211" fill="none" stroke="#596779" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="40" y="217" width="720" height="94" rx="14" fill="#e7f6f4" stroke="#93cec8" stroke-width="2"/>
  <circle cx="79" cy="264" r="23" fill="#167b72"/>
  <text x="79" y="271" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">2</text>
  <text x="120" y="256" fill="#182536" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Plex server builds a play queue</text>
  <text x="120" y="286" fill="#40536b" font-family="Arial, Helvetica, sans-serif" font-size="17">QueuePilot sends the ordered item IDs.</text>
  <path d="M400 314 V328" fill="none" stroke="#596779" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="40" y="334" width="720" height="94" rx="14" fill="#f0f3f8" stroke="#c7d1df" stroke-width="2"/>
  <circle cx="79" cy="381" r="23" fill="#54677f"/>
  <text x="79" y="388" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">3</text>
  <text x="120" y="373" fill="#182536" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Plex returns a queue ID</text>
  <text x="120" y="403" fill="#40536b" font-family="Arial, Helvetica, sans-serif" font-size="17">This is a temporary queue, not a saved Playlist.</text>
  <path d="M400 431 V445" fill="none" stroke="#596779" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="40" y="451" width="720" height="94" rx="14" fill="#fff3df" stroke="#efc881" stroke-width="2"/>
  <circle cx="79" cy="498" r="23" fill="#a7650a"/>
  <text x="79" y="505" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">4</text>
  <text x="120" y="490" fill="#182536" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Plex Companion starts playback</text>
  <text x="120" y="520" fill="#40536b" font-family="Arial, Helvetica, sans-serif" font-size="17">QueuePilot sends the queue ID to the Plex app.</text>
  <path d="M400 548 V562" fill="none" stroke="#596779" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="40" y="568" width="720" height="94" rx="14" fill="#ebf5ea" stroke="#a6cda1" stroke-width="2"/>
  <circle cx="79" cy="615" r="23" fill="#388241"/>
  <text x="79" y="622" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">5</text>
  <text x="120" y="607" fill="#182536" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">The Plex app plays the queue</text>
  <text x="120" y="637" fill="#40536b" font-family="Arial, Helvetica, sans-serif" font-size="17">It reads the queue and streams media from Plex.</text>

  <rect x="40" y="685" width="720" height="61" rx="12" fill="#ffffff" stroke="#8e9aac" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="61" y="710" fill="#30445b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Optional ADB: wake the Shield, open Plex, select a profile.</text>
  <text x="61" y="733" fill="#526176" font-family="Arial, Helvetica, sans-serif" font-size="16">ADB controls the screen. It does not carry the item list.</text>
</svg>
