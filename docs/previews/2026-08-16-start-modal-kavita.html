<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Start modal — Kavita copy</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1419;
        --panel: #1a2230;
        --ink: #e8eef6;
        --muted: #9aa8b8;
        --line: #2a3545;
        --accent: #6d5efc;
        --ghost: #2a3342;
        --field: #121922;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.45 system-ui, sans-serif;
      }
      .stage {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 40px 16px;
        background:
          radial-gradient(800px 400px at 50% 0%, #1c2740, transparent 60%),
          var(--bg);
      }
      .modal {
        width: min(560px, 100%);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 22px 24px 18px;
        box-shadow: 0 24px 60px rgba(0,0,0,.45);
      }
      .head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
      }
      h1 {
        margin: 0;
        font-size: 1.55rem;
        letter-spacing: -0.02em;
      }
      .x {
        width: 36px;
        height: 36px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        font-size: 1.2rem;
        line-height: 1;
      }
      .hint {
        color: var(--muted);
        margin: 14px 0 18px;
      }
      .hint p { margin: 0 0 12px; }
      .field { display: grid; gap: 8px; font-weight: 600; }
      .select {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--field);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
        font-weight: 500;
      }
      .badge {
        font-size: 12px;
        font-weight: 600;
        color: #8fd9a8;
        border: 1px solid #3d6b4e;
        background: #1b2b22;
        border-radius: 999px;
        padding: 2px 8px;
        margin-left: 10px;
      }
      .foot {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 28px;
      }
      button {
        border: 0;
        border-radius: 12px;
        padding: 10px 18px;
        font: inherit;
        font-weight: 650;
        cursor: default;
      }
      .ghost {
        background: var(--ghost);
        color: var(--ink);
      }
      .save {
        background: var(--accent);
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="modal" id="startmodal">
        <div class="head">
          <h1>Start “Multi-mind Mayhem” from…</h1>
          <button class="x" type="button" aria-label="Close">×</button>
        </div>
        <div class="hint">
          <p>
            Reading begins here and keeps going automatically. Earlier
            chapters are skipped — nothing is marked read on Kavita.
          </p>
        </div>
        <label class="field">
          Chapter
          <div class="select">
            <span>Ch 88 · Some Final Business</span>
            <span>
              <span class="badge">Read</span>
              ▾
            </span>
          </div>
        </label>
        <div class="foot">
          <button class="ghost" type="button">Cancel</button>
          <button class="save" type="button">Save</button>
        </div>
      </div>
    </div>
  </body>
</html>
