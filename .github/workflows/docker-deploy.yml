# plex-channels image build+push — GitHub Actions, added 2026-08-02.
#
# Mirrors the mux-magic build-on-push wiring (`.github/workflows/docker-deploy.yml`):
# a `workflow_run` trigger fires after CI concludes, and on success this builds the
# app image and pushes it to GHCR. The Dockerfile is self-contained (it builds the
# React `web/` in its own stage), so unlike mux-magic there are no host-side Node
# build steps here — just checkout + build-push.
#
# Registry: GHCR (`ghcr.io/sawtaytoes/queuepilot`), the fleet's GitHub-Actions
# build target (same as mux-magic). This SUPERSEDES the old manual path that pushed
# to the LAN registry `docker-registry.example.com/plex-channels:latest` via build.sh
# on nas — a GitHub-hosted runner can't reach that private LAN registry.
#
# NOTE: pushing `:latest` here does NOT by itself redeploy the running TrueNAS app —
# the app's image reference must point at GHCR and a redeploy must be triggered. See
# docs/decisions/2026-08-02-ci-and-deploy-on-github-actions-to-ghcr.md for the cutover.
name: Docker Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches:
      - main
    types: [completed]
  workflow_dispatch:

# Group by the branch that actually ran CI, not github.ref — under a workflow_run
# trigger github.ref is always the default branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}

jobs:
  # Did CI actually run its gates, or did it skip them?
  #
  # CI skips every gate when the diff is documentation only, and mux-magic's
  # also skips when this exact SHA already had a green run. In BOTH cases the
  # workflow concludes `success`, so the `conclusion == 'success'` test below
  # is true and this deploy used to rebuild and push an image for a change
  # that could not alter it -- churning the mutable `latest` tag for nothing.
  #
  # Asking CI what it did is more reliable than re-deriving the diff here. A
  # `workflow_run` payload carries no `before` SHA, so this workflow cannot
  # see the range that CI saw -- only the head commit.
  changes:
    runs-on: ubuntu-latest

    permissions:
      actions: read

    outputs:
      didCiRun: ${{ steps.detect.outputs.didCiRun }}

    steps:
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Fails SAFE: a manual dispatch has no upstream run to inspect, so
          # it builds.
          if [ "$EVENT" != "workflow_run" ] || [ -z "${RUN_ID:-}" ]
          then
            echo "Not a workflow_run trigger -- building."
            echo "didCiRun=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          conclusion="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" \
            --jq '[.jobs[] | select(.name == "ci")] | first | .conclusion // "unknown"')"
          echo "CI job 'ci' concluded: ${conclusion}"

          if [ "${conclusion}" = "skipped" ]
          then
            echo "CI skipped its gates -- nothing new to build."
            echo "didCiRun=false" >> "$GITHUB_OUTPUT"
          else
            echo "didCiRun=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [changes]
    # `!= 'false'` not `== 'true'`: if the `changes` job itself fails,
    # the output is empty and this still builds.
    if: ${{ needs.changes.outputs.didCiRun != 'false' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # workflow_run's github.sha resolves to the DEFAULT branch, not the
          # branch that ran CI — use the triggering run's head_sha so the image
          # matches its tag.
          ref: "${{ github.event.workflow_run.head_sha || github.sha }}"

      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute branch tag
        id: tags
        run: |
          branch_tag="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          branch_tag="${branch_tag//\//-}"
          echo "branch_tag=${branch_tag}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/sawtaytoes/queuepilot:${{ github.event.workflow_run.head_sha || github.sha }}
            ghcr.io/sawtaytoes/queuepilot:${{ steps.tags.outputs.branch_tag }}
            ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'ghcr.io/sawtaytoes/queuepilot:latest' || '' }}
