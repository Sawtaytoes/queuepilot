# queuepilot CI — GitHub Actions (github.com), ported 2026-08-02 from the
# retired Forgejo workflow `.gitea/workflows/ci.yml` when the repo moved to public
# GitHub. Steps are a faithful 1:1 translation; only the runner home changed.
#
# The workflow name MUST stay "CI" — `docker-deploy.yml` keys its `workflow_run`
# trigger on `workflows: ["CI"]`, mirroring the mux-magic ci.yml → docker-deploy.yml
# pair.
#
# Action versions are pinned to the CURRENT latest majors (per Bob's "no @v4,
# pick the latest" rule), same pins the Forgejo file used:
#   actions/checkout      @v7
#   actions/setup-node    @v7
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Job-level so the browser-suite step can gate on `env.PLEX_TOKEN != ''`
      # (GitHub forbids referencing `secrets` in a job-level `if:`, but a
      # step-level `if:` can read `env`). Empty when the secret is unset → the
      # browser suites are skipped and the job still concludes success.
      PLEX_TOKEN: ${{ secrets.PLEX_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # server deps are needed so the e2e suites can spawn server/src/server.js
      # (node_modules is gitignored; package-lock.json is committed → npm ci).
      - name: Install server deps
        run: npm ci --prefix server

      # `node --check` takes ONE file at a time, so loop the glob rather than
      # passing them all in one invocation. The frontend is no longer a plain
      # script — it is typechecked and built below instead.
      - name: Node syntax check
        run: |
          for f in $(find server/src -name '*.js'); do
            echo "--check $f"
            node --check "$f"
          done

      # --- the React frontend (M6d) --------------------------------------------
      # `web/` is React 19 + TypeScript + Vite + Tailwind v4 on @charcuterie/tokens.
      # These three are the frontend's gates and they must run BEFORE the browser
      # suites, which drive server/src/server.js — and that serves web/dist.
      - name: Install web deps
        run: npm ci --prefix web --no-audit --no-fund

      # Biome is formatter + linter for web/. Runs before typecheck so a
      # formatting/lint failure reads as one, rather than as a build problem.
      - name: Web lint (Biome)
        run: npm --prefix web run lint:biome

      - name: Web typecheck
        run: npm --prefix web run typecheck

      - name: Web unit tests
        run: npm --prefix web test

      - name: Web build
        run: npm --prefix web run build

      # Engine unit tests that stub Plex entirely (no token, no network). Node ports of the
      # Python engine tests that were deleted with queue_builder/ on 2026-08-12 — the collection
      # START floor (skip earlier members, floor the named one), the non-consuming keep_completed
      # flag, resume-in-queue (a started-but-unfinished queued item resumes at its viewOffset,
      # threaded to playMedia), in-progress-not-done (a started OAD/special is never marked done,
      # and a stale done flag is revived), the playback state machine, and the session profile
      # gate. The §B.3 TTL sweep + specials/extras filter run in the browserless block below.
      - name: Engine tests (offline)
        run: |
          node e2e/collection-start-test.mjs
          node e2e/keep-completed-test.mjs
          node e2e/resume-in-queue-test.mjs
          node e2e/resume-in-progress-done-test.mjs
          node e2e/playback-fsm-test.mjs
          node e2e/fsm-wake-and-skip-test.mjs
          node e2e/session-profile-gate-test.mjs
          node e2e/profile-gate-test.mjs

      # The plex-channels -> queuepilot topic bridge. Every way this can break is silent —
      # a card publishes where nothing listens and the broker cheerfully accepts it — so the
      # prefix mapping is pinned in both directions, bridge on and bridge off.
      - name: MQTT rename bridge (offline)
        run: node e2e/mqtt-legacy-bridge-test.mjs

      # The retained device registry — the "Play on ▾" dropdown's source. Its failures are
      # invisible for the same reason the bridge's are: retained topics keep serving the last
      # announcement, so a registry that stopped sweeping and one that stopped clearing both
      # look like a plausible list of devices (that is exactly how the Node port shipped
      # Shield-only for months while the UI showed two Python-era ghosts). Both halves are
      # pinned — the plex.tv player sweep, and the empty-payload de-registration — with
      # plex.tv stubbed, so it runs with no token and no network.
      - name: Device registry (offline)
        run: node e2e/device-registry-test.mjs

      # The provider CONFIG + BLOCK STORAGE layer. Guards the two rules that are cheap to
      # break and expensive to notice:
      #   * an unset provider token FAILS LOUDLY and by name. Two production outages came
      #     from a placeholder that looked like config, and both looked identical from the
      #     couch — the card opened Plex and nothing played. A token must never fall through
      #     to '' or an unauthenticated request, and must never appear in an API response.
      #   * provider blocks are a LIST from day one, a pre-blocks set reads as ONE implicit
      #     Plex block without being migrated on read, and a MIXED set THROWS rather than
      #     picking a provider — what a mixed queue hands off is an open owner decision, so a
      #     silent answer here would be the implementation deciding it.
      # Runs with no token and no network; every path is redirected to a scratch dir.
      - name: Provider seam (offline)
        run: node e2e/provider-seam-test.mjs

      # The Kavita provider and the 302 launcher, with HTTP fully stubbed. Pins the details
      # that are invisible until a real card fails: continue-point returns a NULL seriesId
      # (so the provider must thread it back in or every deep link points at series `null`),
      # ReadingList/lists is a POST not a GET, the reader variant follows seriesFormat, and
      # the deep link carries ?readingListId= — which is what makes next/prev resolve through
      # the LIST instead of the series, i.e. the cross-series auto-advance the feature is for.
      # Also pins that handoff() returns a URL and never a device push: Kavita has no cast
      # and no webhooks, and reading is pull.
      - name: Kavita provider + launcher (offline)
        run: node e2e/kavita-provider-test.mjs

      # A set whose ONLY source is a non-Plex provider must save. Reported from the live app:
      # creating a Channel with a single Kavita block failed with "at least one library
      # section required", because `sections` is PLEX's list and is legitimately empty on a
      # Kavita-only set — its libraries live in the provider blocks. Two defects, both pinned
      # here: the validators rejected the save, and createSet never WROTE `providers` at all,
      # which would have created the set with no source and failed quietly instead of loudly.
      - name: Kavita-only set saves (offline)
        run: node e2e/kavita-only-set-test.mjs

      # Prove server/src/engine/routing.js decides set:"auto" routing (channel_for/binding_for/
      # set_sections/rewatch_sections) exactly as the retired Python did, by diffing it against
      # that engine's RECORDED answers (e2e/fixtures/golden/routing.json) over
      # e2e/fixtures/routing.sets.yaml. The golden is a contract: a failure means Node moved.
      - name: Routing parity (Node engine ↔ recorded oracle)
        run: node e2e/binding-parity.mjs

      # Companion to D2: that gate diffs routing DECISIONS, this one diffs the per-set cfg
      # the decisions are made from. A passthrough the Node builder forgets doesn't throw and
      # doesn't fail a routing test — it reads `undefined` at the consumer and silently
      # DISABLES the feature (how requires_profile went dead for 12 gated sets, 2026-08-11).
      - name: Set-passthrough parity (Node engine ↔ recorded oracle)
        run: node e2e/set-passthrough-parity.mjs

      # Prove server/src/engine/select.js computes the unwatched-buckets pool exactly as the
      # retired Python engine did, over the committed SYNTHETIC corpus (no real library data —
      # owner decision 2026-08-07) against e2e/fixtures/golden/engine.json.
      - name: Engine parity (Node engine ↔ recorded oracle)
        run: node e2e/engine-parity.mjs

      # Prove server/src/engine/resolve.js resolves a curated QUEUE (nextQueue) and a REEL
      # (buildReel) as the retired Python did — the title→ratingKey resolver, collection
      # expansion, keepEpisode/watched filtering and the done/unresolved classification — over
      # the SAME synthetic corpus, against e2e/fixtures/golden/curated.json. The write side is
      # the mark-done gate below.
      - name: Curated parity (Node engine ↔ recorded oracle)
        run: node e2e/curated-parity.mjs

      # `batch_stops_at` in the Node port: same assertion table as the Python engine test above
      # (a parity DIFF can't catch this — the feature lands identically in both engines, so a
      # diff stays green whether or not either side implements it).
      - name: Batch boundaries (Node engine)
        run: node e2e/batch-stops-at-test.mjs

      # Async engine + live-client surface + preview formatter (offline).
      - name: Live-client adapter (offline)
        run: node e2e/live-client-adapter-test.mjs

      # Queue write-side: markDone/clearDone/sweepCompleted round-trip the YAML comments.
      - name: Queue write-side (markDone/clearDone)
        run: node e2e/mark-done-parity.mjs

      - name: adb pure helpers
        run: node e2e/adb-unit-test.mjs

      # Browserless e2e — self-contained: each spawns its own server on a private
      # port with private /tmp files and asserts the degraded (no Plex / no MQTT)
      # paths, so they need neither a Plex token nor Playwright. Always run.
      - name: Browserless e2e
        run: |
          node e2e/history-persist-test.mjs
          node e2e/api-v2-test.mjs
          node e2e/sse-resync-test.mjs
          node e2e/ttl-sweep-test.mjs
          node e2e/specials-count-test.mjs
          node e2e/leaves-revalidate-test.mjs
          node e2e/leaves-per-account-test.mjs
          node e2e/collection-batch-cap-test.mjs
          node e2e/resume-on-advance-test.mjs

      # Narrow-view layout gate — ALWAYS runs, unlike the Plex-gated browser suites below.
      #
      # It needs a browser but NOT Plex: it drives the Play landing on the degraded
      # no-Plex path and measures `documentElement.scrollWidth`. That measurement is the
      # only thing that catches the class of bug it guards — the 2026-08-10 narrow-view
      # horizontal scroll passed typecheck, the unit tests, the build and all seventeen
      # Playwright suites, because every one of them asserts behaviour and none asserts
      # geometry. Putting it in the PLEX_TOKEN-gated step below would mean it never runs:
      # the secret is unset, so that step is skipped on every PR today.
      #
      # Cost: ~1 min for the chromium download. If that is judged too expensive, move this
      # step's `node e2e/narrow-scroll-test.mjs` into the gated loop below and accept that
      # the gate only fires when the secret is present.
      - name: Narrow-view horizontal-scroll gate (browser, no Plex needed)
        env:
          QUEUES_PATH: /tmp/queues-narrow.yaml
          SETS_PATH: /tmp/sets-narrow.yaml
          HISTORY_PATH: /tmp/.history-narrow.json
          WEB_PORT: '18769'
        run: |
          npm install playwright
          npx playwright install chromium --with-deps
          unset MQTT_HOST MQTT_PORT MQTT_USER MQTT_PASS
          cp e2e/fixtures/queues.fixture.yaml /tmp/queues-narrow.yaml
          node server/src/server.js >/tmp/narrow-e2e.log 2>&1 &
          SRV=$!; sleep 1.5
          node e2e/narrow-scroll-test.mjs; rc=$?
          kill $SRV 2>/dev/null || true; wait $SRV 2>/dev/null || true
          exit $rc

      # The pick.mjs <-> SelectListbox contract — browser, no Plex, no app
      # server. Every picker is a Charcuterie `Listbox` behind a button, and
      # `e2e/pick.mjs` is how all seventeen browser suites drive one; but those
      # suites are all in the PLEX_TOKEN-gated step below, which is skipped on
      # every PR. So the contract that replaced `selectOption()` had NO
      # coverage on a pull request, and the 2026-08-13 Picker migration had to
      # be verified by hand. This step is that verification made permanent.
      #
      # Runs a `vite` dev server on its own port against a dependency-free
      # harness page (web/e2e-harness/) that mounts the real component. The
      # page is dev-only: vite.config.ts names one build entry, so it is not
      # in dist/. Reuses the chromium the narrow-view step above installed —
      # keep it AFTER that step.
      - name: pick.mjs picker contract (browser, no Plex needed)
        run: node e2e/pick-contract-test.mjs

      # Browser e2e (Playwright) — GATED on the PLEX_TOKEN secret. These suites
      # `require('playwright')` and drive a Chromium browser, and the shared
      # server they hit talks to Plex. We can't call e2e/run.sh directly (it
      # `source`s the sandbox-only /mnt/.../agentic/.env), so we replicate its
      # per-suite loop inline: fresh server + fixture files per suite. Playwright
      # is installed at the repo root so `require('playwright')` from e2e/
      # resolves up into ./node_modules.
      - name: Browser e2e (Playwright, gated on PLEX_TOKEN secret)
        if: env.PLEX_TOKEN != ''
        env:
          QUEUES_PATH: /tmp/queues-ui.yaml
          SETS_PATH: /tmp/sets-ui.yaml
          WEB_PORT: '18768'
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        run: |
          npm install playwright
          npx playwright install chromium --with-deps
          # suites assert the degraded no-broker path — keep MQTT unset
          unset MQTT_HOST MQTT_PORT MQTT_USER MQTT_PASS
          fail=0
          for t in kbd-undo-test ui-test homedrag-test channels-test sse-test; do
            echo "=== $t ==="
            rm -rf /tmp/sets-ui.yaml /tmp/sets-ui.yaml.lock /tmp/queues-ui.yaml.lock /tmp/.history.json
            cp e2e/fixtures/queues.fixture.yaml /tmp/queues-ui.yaml
            node server/src/server.js >/tmp/web-e2e.log 2>&1 &
            SRV=$!; sleep 1.5
            node "e2e/$t.mjs" || fail=$((fail+1))
            kill $SRV 2>/dev/null || true; wait $SRV 2>/dev/null || true
          done
          echo "browser suites failed: $fail"; exit $fail
