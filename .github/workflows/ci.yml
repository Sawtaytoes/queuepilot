# queuepilot CI — GitHub Actions (github.com), ported 2026-08-02 from the
# retired Forgejo workflow `.gitea/workflows/ci.yml` when the repo moved to public
# GitHub. It was a faithful 1:1 translation of that file until the Hono/TypeScript
# conversion, which changed three things across every step: server/ and e2e/ are
# TypeScript (so `node` is `$TSX` below, and the old `node --check` loop became two real
# typechecks), the harnesses are `.ts`, and the prod artifact is an esbuild bundle that
# now gets built here.
#
# The workflow name MUST stay "CI" — `docker-deploy.yml` keys its `workflow_run`
# trigger on `workflows: ["CI"]`, mirroring the mux-magic ci.yml → docker-deploy.yml
# pair.
#
# Action versions are pinned to the CURRENT latest majors (per Bob's "no @v4,
# pick the latest" rule), same pins the Forgejo file used:
#   actions/checkout      @v7
#   actions/setup-node    @v7
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    # A CI job that stops making progress must FAIL, not sit there.
    #
    # 2026-08-19: four runs stalled inside `playwright install --with-deps`, which is an apt
    # call — the log ends mid `apt-get update` against archive.ubuntu.com and resumes six
    # hours later with "Terminate orphan process". With no timeout anywhere, the only thing
    # that eventually stopped it was GitHub's own 6h workflow cap, and each of those runs
    # held a concurrency slot for the whole time. One of them took the deploy with it: the
    # run had to be cancelled by hand, and `docker-deploy.yml` gates on
    # `workflow_run.conclusion == 'success'`, so a cancelled CI silently SKIPS the deploy.
    #
    # This suite is ~4-8 minutes warm. 30 is generous enough that a slow-but-working run is
    # never killed, and short enough that a wedged one costs minutes.
    timeout-minutes: 30
    env:
      # Job-level so the browser-suite step can gate on `env.PLEX_TOKEN != ''`
      # (GitHub forbids referencing `secrets` in a job-level `if:`, but a
      # step-level `if:` can read `env`). Empty when the secret is unset → the
      # browser suites are skipped and the job still concludes success.
      PLEX_TOKEN: ${{ secrets.PLEX_TOKEN }}
      # server/src is TypeScript since the Hono conversion: plain `node` can neither load an
      # entry point ending .ts nor resolve the `./foo.js` specifiers inside it, so every
      # harness and every server boot below goes through tsx. It is a server/ devDependency,
      # installed by the yarn step below, and addressed by bin path — `npx` is denied fleet
      # wide (decision 2026-06-18) and `yarn workspace … run` would spawn a shell per call.
      #
      # `nmHoistingLimits: workspaces` is what keeps this path valid: each workspace has its
      # own node_modules, exactly as the three npm installs used to.
      TSX: server/node_modules/.bin/tsx
      # The COMMITTED yarn release, run through node — NOT corepack. `actions/setup-node`
      # gives us Node 26, and Node dropped corepack from the distribution in 25, so
      # `corepack enable` is "command not found" here (and in the Dockerfile's node:26 base,
      # where it was caught by an actual build). Running the release file directly also means
      # CI never fetches a package manager over the network to install packages with.
      #
      # Same file `.yarnrc.yml` names as `yarnPath` — if you bump yarn, bump both.
      YARN: node .yarn/releases/yarn-4.14.1.cjs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # ONE install for all three workspaces (web, server, e2e). It was three `npm ci`s and
      # an unpinned `npm install playwright`; yarn is the fleet's package manager and npm/npx
      # are denied (decision 2026-06-18-use-yarn-base-on-mux-magic).
      #
      # `--immutable` is the point of committing the lockfile: CI fails on a manifest whose
      # lockfile was not updated, rather than quietly resolving something else.
      - name: Install (yarn workspaces)
        run: $YARN install --immutable

      # ---- Playwright's browser, ONCE, cached ----
      #
      # This ran TWICE per job (the narrow-view gate and the browser-e2e gate each did their
      # own `npm install playwright` + install), unpinned both times, downloading chromium
      # from the network on every run of every PR.
      #
      # Playwright is a real, pinned devDependency of the e2e workspace now, so the CLI and
      # the module are the SAME copy at the SAME version — which is the property
      # `e2e/playwright.ts` depends on: it resolves `playwright`, asks it for
      # `chromium.executablePath()`, and requires that path to exist. A browser set installed
      # by a different Playwright is pinned to a different build number, so a mismatch finds
      # the package and rejects its browsers.
      #
      # The cache key is the resolved version out of the lockfile, so a Playwright bump
      # invalidates it and nothing else does.
      - name: Resolve the pinned Playwright version
        id: pw
        run: echo "version=$(node -p "require('./e2e/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # SPLIT, and the apt half is best-effort — inherited from #144 and still exactly right.
      # `--with-deps` shells out to apt-get, and on 2026-08-19 GitHub's
      # azure.archive.ubuntu.com mirror stopped answering: every index line came back `Ign:`,
      # apt retried forever, and with no bound anywhere one run sat for SIX HOURS before the
      # workflow cap killed it.
      #
      # The BROWSER download comes from Playwright's own CDN and is the part the gates
      # actually need, so it runs on its own. The system libraries are a nice-to-have on
      # ubuntu-latest, whose image already ships what chromium needs — so a dead apt mirror
      # must not be able to block CI for a whole repo.
      - name: Install chromium
        timeout-minutes: 15
        run: |
          PW=e2e/node_modules/.bin/playwright
          DEBIAN_FRONTEND=noninteractive timeout 300 "$PW" install-deps chromium \
            || echo "playwright install-deps failed or timed out (apt mirror?) — continuing; the runner image ships chromium's libs"
          timeout 600 "$PW" install chromium

      # The server's real gate. This replaced a `for f in $(find server/src -name '*.js');
      # do node --check "$f"; done` loop, which after the Hono/TypeScript conversion matched
      # ZERO files (server/src is all .ts now) and so passed unconditionally — and even
      # before that it only ever proved each file PARSED. `tsc --noEmit` against
      # server/tsconfig.json is the gate `node --check` never was.
      #
      # No extra install: the one `yarn install` above hydrates every workspace, and
      # `typescript` (and `tsx`, and `esbuild`) are server/ devDependencies.
      - name: Server typecheck
        run: $YARN workspace queuepilot-server run typecheck

      # The harnesses are TypeScript too, and they are the only consumer of several
      # server/src exports — a signature change that server/ typechecks against its own
      # callers still breaks them. e2e/ is a real workspace with its own `typescript` and
      # `playwright` now, so it runs its own script rather than borrowing server's tsc.
      - name: e2e typecheck
        run: $YARN workspace queuepilot-e2e run typecheck

      # The prod artifact is an esbuild bundle, not the tsc output — `tsc --noEmit` above
      # cannot catch a bundling break (an unresolvable import, a native dep that will not
      # bundle), and the Dockerfile builds it. Gate it here rather than discovering it at
      # deploy time; mux-magic and castkit both do this.
      - name: Server build (esbuild bundle)
        run: $YARN workspace queuepilot-server run build

      # --- the React frontend (M6d) --------------------------------------------
      # `web/` is React 19 + TypeScript + Vite + Tailwind v4 on @charcuterie/tokens.
      # These three are the frontend's gates and they must run BEFORE the browser
      # suites, which drive the server — and that serves web/dist.
      # Biome is formatter + linter for web/. Runs before typecheck so a
      # formatting/lint failure reads as one, rather than as a build problem.
      - name: Web lint (Biome)
        run: $YARN workspace queuepilot-web run lint:biome

      - name: Web typecheck
        run: $YARN workspace queuepilot-web run typecheck

      - name: Web unit tests
        run: $YARN workspace queuepilot-web run test

      - name: Web build
        run: $YARN workspace queuepilot-web run build

      # Engine unit tests that stub Plex entirely (no token, no network). Node ports of the
      # Python engine tests that were deleted with queue_builder/ on 2026-08-12 — the collection
      # START floor (skip earlier members, floor the named one), the non-consuming keep_completed
      # flag, resume-in-queue (a started-but-unfinished queued item resumes at its viewOffset,
      # threaded to playMedia), in-progress-not-done (a started OAD/special is never marked done,
      # and a stale done flag is revived), the playback state machine, and the session profile
      # gate, and the binding token (a multi-profile channel plays as the profile that was
      # PICKED, not as profiles[0] — the live 2026-08-14 silent-no-play bug), and play-one-entry
      # (the grid's per-tile ▶ narrows the ENTRY LIST, so the named entry still gets its own next
      # unwatched episode — and a finished or deleted one plays NOTHING rather than silently
      # falling back to the queue's head, which would start something nobody clicked), and the
      # curated-queue profile (a queue gated to a kid selects from THAT kid's history — the
      # 2026-08-16 "Carol 1" bug, where `requires_profile` was a play gate and never an
      # account, so the queue picked up where the OWNER left off).
      # account (the 2026-08-18 wrong-account play: the gate said Younger Kids, HA was told
      # `played: true`, and Plex scrobbled all three shorts to the OWNER — because nothing
      # between "CENTER was pressed" and "Companion answered 200" can see which profile Plex
      # actually signed into. account-audit-test pins the read-back that now can).
      # The §B.3 TTL sweep + specials/extras filter run in the browserless block below.
      - name: Engine tests (offline)
        run: |
          "$TSX" e2e/collection-start-test.ts
          "$TSX" e2e/keep-completed-test.ts
          "$TSX" e2e/resume-in-queue-test.ts
          "$TSX" e2e/resume-in-progress-done-test.ts
          "$TSX" e2e/playback-fsm-test.ts
          "$TSX" e2e/fsm-wake-and-skip-test.ts
          "$TSX" e2e/account-audit-test.ts
          "$TSX" e2e/session-profile-gate-test.ts
          "$TSX" e2e/profile-gate-test.ts
          "$TSX" e2e/binding-token-test.ts
          "$TSX" e2e/play-one-entry-test.ts
          "$TSX" e2e/curated-queue-profile-test.ts

      # "Completed" without waiting for the next card tap. `markDone` used to have ONE caller
      # — a session START — so a film finished at 22:34 kept a blank tile until the card was
      # tapped again (live, 2026-08-16: Plex had viewCount 1 and a history row; /api/queues
      # said `done: false` for all 21 entries). Both new evaluations are pinned: the write
      # side re-runs when PLAYBACK ENDS without playing anything (and a reel / keep_completed
      # set is still never marked), and /api/queues reports `isFinished` live — proven against
      # a deliberately STALE section listing, since a movie tile's cached viewCount can be a
      # week old and nothing busts it. Spawns its own server against a stub Plex.
      - name: Finished-entry freshness (offline)
        run: $TSX e2e/finished-live-test.ts

      # The retained device registry — the "Play on ▾" dropdown's source. Its failures are
      # invisible: retained topics keep serving the last announcement, so a registry that
      # stopped sweeping and one that stopped clearing both look like a plausible list of
      # devices (that is exactly how the Node port shipped
      # Shield-only for months while the UI showed two Python-era ghosts). Both halves are
      # pinned — the plex.tv player sweep, and the empty-payload de-registration — with
      # plex.tv stubbed, so it runs with no token and no network.
      - name: Device registry (offline)
        run: $TSX e2e/device-registry-test.ts

      # The provider CONFIG + BLOCK STORAGE layer. Guards the two rules that are cheap to
      # break and expensive to notice:
      #   * an unset provider token FAILS LOUDLY and by name. Two production outages came
      #     from a placeholder that looked like config, and both looked identical from the
      #     couch — the card opened Plex and nothing played. A token must never fall through
      #     to '' or an unauthenticated request, and must never appear in an API response.
      #   * provider blocks are a LIST from day one, a pre-blocks set reads as ONE implicit
      #     Plex block without being migrated on read, and a MIXED set THROWS rather than
      #     picking a provider — what a mixed queue hands off is an open owner decision, so a
      #     silent answer here would be the implementation deciding it.
      # Runs with no token and no network; every path is redirected to a scratch dir.
      - name: Provider seam (offline)
        run: $TSX e2e/provider-seam-test.ts

      # The Kavita provider and the 302 launcher, with HTTP fully stubbed. Pins the details
      # that are invisible until a real card fails: continue-point returns a NULL seriesId
      # (so the provider must thread it back in or every deep link points at series `null`),
      # ReadingList/lists is a POST not a GET, the reader variant follows seriesFormat, and
      # the deep link carries ?readingListId= — which is what makes next/prev resolve through
      # the LIST instead of the series, i.e. the cross-series auto-advance the feature is for.
      # Also pins that handoff() returns a URL and never a device push: Kavita has no cast
      # and no webhooks, and reading is pull.
      - name: Kavita provider + launcher (offline)
        run: $TSX e2e/kavita-provider-test.ts

      # The THIRD provider kind, and the one that is not a media server: Board Game Picker.
      # Two things this gate exists for, both of which would be silent failures:
      #   * PRIVACY. The provider must never call the picker's /api/collection, which carries
      #     players, groups and who was at the table — this repo is public. The stub records
      #     every request and the suite asserts that URL is not among them.
      #   * `queued_at`. Plays are counted from when an entry was QUEUED, never from the
      #     picker's lifetime play log: a game with twenty plays behind it and a batch of
      #     three has three plays left the day it is queued, not zero.
      - name: Board Game Picker provider + launcher (offline)
        run: $TSX e2e/board-game-picker-provider-test.ts

      # The Steam gates, and why each exists:
      #   * `queued_at` again, but the trap points the OTHER way from the picker's. Steam
      #     reports a LIFETIME playtime; the account this was built against has a 508-hour
      #     game in it. Count that and every game retires itself the instant it is queued.
      #   * An entry with NO stamp reads as NOT played — the opposite of the picker's
      #     pre-stamp behaviour, because retiring a game the owner has never played is the
      #     failure he would actually notice.
      #   * Privacy: exactly one Valve endpoint (GetOwnedGames) plus the public art CDN, and
      #     never the profile or friends list — this repo is public.
      #   * A PRIVATE profile answers 200 with an empty body. Read as "owns nothing", that is
      #     a queue that silently renders empty; it must fail by name instead.
      - name: Steam provider (offline)
        run: $TSX e2e/steam-provider-test.ts

      # The MiSTer gates. This provider's whole character is what it REFUSES to do:
      #   * It never claims progress. mrext keeps no history, so progressState() is empty and
      #     newlyDone is empty. Guessing from /games/playing would retire a queued game
      #     because something else was started from the MiSTer's own menu.
      #   * It never launches. Calling mrext's /games/launch would skip the OSD save, the
      #     Xbox adapter enable and the activity switch Home Assistant does around a launch —
      #     and would be a service-to-service REST bridge. The stub asserts on the path.
      #   * A powered-down MiSTer is not an empty queue: tiles derive from the stored path
      #     and cost no network call at all.
      - name: MiSTer provider (offline)
        run: $TSX e2e/mister-provider-test.ts

      # A set whose ONLY source is a non-Plex provider must save. Reported from the live app:
      # creating a Channel with a single Kavita block failed with "at least one library
      # section required", because `sections` is PLEX's list and is legitimately empty on a
      # Kavita-only set — its libraries live in the provider blocks. Two defects, both pinned
      # here: the validators rejected the save, and createSet never WROTE `providers` at all,
      # which would have created the set with no source and failed quietly instead of loudly.
      # The library gate is GONE as of 2026-08-17 — naming no library means EVERY library
      # (decision 2026-08-17-no-libraries-checked-means-every-library) — so the last case in
      # this suite pins that an unscoped set SAVES rather than that it is refused.
      - name: Kavita-only set saves (offline)
        run: $TSX e2e/kavita-only-set-test.ts

      # The lineup knobs' WRITE side, now that the pool editor sets them. The editor posts
      # every knob it renders on every Save, so the thing that has to hold is SPARSE storage:
      # a `length` equal to the env default, a `refill: false` and an `on_complete: drop` are
      # stored by absence, or renaming a pool stamps three keys that say nothing onto it and
      # quietly stops it following ROTATION_LENGTH. Also pins that `createSet` handles all
      # three at all — it did not, so a pool created with top-up on came back with it off.
      - name: Lineup knobs write side (offline)
        run: $TSX e2e/lineup-knobs-test.ts

      # PLAYBACK LENGTH — how many things a set plays before it stops, for every kind of set.
      # The claim this exists to hold is not "the number is read" but "no existing set moves on
      # deploy": three of the four paths hardcoded their length and two hardcoded it
      # differently, so every default here is the behaviour that kind already had. Also pins
      # that `infinite` is a NAMED value (never 0, never 999 — a falsy count reads as uncapped
      # deeper in the engine), that top-up derives from the length rather than a stored flag,
      # and that a legacy `refill: true` still reads as infinite so the live Shorts card keeps
      # refilling with its file untouched.
      - name: Playback length (offline)
        run: $TSX e2e/playback-length-test.ts
      # Group membership + the groups.yaml writer. The rule that needs a gate is
      # EXPLICIT-BEATS-DERIVED: nearly every curated queue is gated to `sawtaytoes`, so an
      # account-first resolution sweeps every audience into "Bob" and the distinction the
      # feature exists for disappears — while still LOOKING like a working feature with one
      # over-full chip. The opposite failure (derivation not firing, so the account-only
      # groups Kids and Demo come out empty) is pinned in the same file.
      - name: Groups (offline)
        run: $TSX e2e/groups-test.ts

      # A reading queue's ARTWORK and TILES come from its provider, not from Plex. Reported
      # from the live app: a search dropdown of broken-image glyphs, because the cover proxy
      # shipped and nothing ever called it — the frontend's only move was /api/thumb, which is
      # Plex's, and answers 502 for a Kavita seriesId. The same blindness sat in /api/queues,
      # where every reading entry was resolved against Plex and came back unresolved: no
      # poster, no next-up. Runs against a STUB Kavita on 127.0.0.1 with Plex pointed at a dead
      # port, which is also what proves none of this path touches Plex.
      - name: Kavita covers + provider tiles (offline)
        run: $TSX e2e/kavita-covers-test.ts

      # Two bugs found on the live "Manga & Webtoons" queue, both invisible to every gate
      # above because both stubs happened to be chapter-based and library-driven:
      #   * a VOLUME-based manga read as fully read. Kavita puts nothing in
      #     `chapters`/`specials` for one — every chapter hangs off `volumes[].chapters[]` —
      #     so "Alice in Borderland" (0 of 328 pages read) rendered "All read". A webtoon
      #     returns the same chapters in BOTH places, so the fix has to dedupe by chapter id.
      #   * a CURATED queue played the library SHELF. buckets() enumerated seriesForLibrary
      #     and never read the queue's entries, so a 93-entry reading queue produced a list
      #     of 12 alphabetical series, exactly one of which had been added on purpose.
      - name: Kavita volumes + curated entries (offline)
        run: $TSX e2e/kavita-volumes-and-members-test.ts

      # Prove server/src/engine/routing.js decides set:"auto" routing (channel_for/binding_for/
      # set_sections/rewatch_sections) exactly as the retired Python did, by diffing it against
      # that engine's RECORDED answers (e2e/fixtures/golden/routing.json) over
      # e2e/fixtures/routing.sets.yaml. The golden is a contract: a failure means Node moved.
      - name: Routing parity (Node engine ↔ recorded oracle)
        run: $TSX e2e/binding-parity.ts

      # Companion to D2: that gate diffs routing DECISIONS, this one diffs the per-set cfg
      # the decisions are made from. A passthrough the Node builder forgets doesn't throw and
      # doesn't fail a routing test — it reads `undefined` at the consumer and silently
      # DISABLES the feature (how requires_profile went dead for 12 gated sets, 2026-08-11).
      - name: Set-passthrough parity (Node engine ↔ recorded oracle)
        run: $TSX e2e/set-passthrough-parity.ts

      # Prove server/src/engine/select.js computes the unwatched-buckets pool exactly as the
      # retired Python engine did, over the committed SYNTHETIC corpus (no real library data —
      # owner decision 2026-08-07) against e2e/fixtures/golden/engine.json.
      - name: Engine parity (Node engine ↔ recorded oracle)
        run: $TSX e2e/engine-parity.ts

      # Prove server/src/engine/resolve.js resolves a curated QUEUE (nextQueue) and a REEL
      # (buildReel) as the retired Python did — the title→ratingKey resolver, collection
      # expansion, keepEpisode/watched filtering and the done/unresolved classification — over
      # the SAME synthetic corpus, against e2e/fixtures/golden/curated.json. The write side is
      # the mark-done gate below.
      - name: Curated parity (Node engine ↔ recorded oracle)
        run: $TSX e2e/curated-parity.ts

      # `batch_stops_at` in the Node port: same assertion table as the Python engine test above
      # (a parity DIFF can't catch this — the feature lands identically in both engines, so a
      # diff stays green whether or not either side implements it).
      - name: Batch boundaries (Node engine)
        run: $TSX e2e/batch-stops-at-test.ts

      # Async engine + live-client surface + preview formatter (offline).
      - name: Live-client adapter (offline)
        run: $TSX e2e/live-client-adapter-test.ts

      # Queue write-side: markDone/clearDone/sweepCompleted round-trip the YAML comments.
      - name: Queue write-side (markDone/clearDone)
        run: $TSX e2e/mark-done-parity.ts

      - name: adb pure helpers
        run: $TSX e2e/adb-unit-test.ts

      # Browserless e2e — self-contained: each spawns its own server on a private
      # port with private /tmp files and asserts the degraded (no Plex / no MQTT)
      # paths, so they need neither a Plex token nor Playwright. Always run.
      - name: Browserless e2e
        run: |
          "$TSX" e2e/history-persist-test.ts
          "$TSX" e2e/api-v2-test.ts
          "$TSX" e2e/sse-resync-test.ts
          "$TSX" e2e/ttl-sweep-test.ts
          "$TSX" e2e/specials-count-test.ts
          "$TSX" e2e/leaves-revalidate-test.ts
          "$TSX" e2e/leaves-per-account-test.ts
          "$TSX" e2e/collection-children-per-account-test.ts
          "$TSX" e2e/collection-batch-cap-test.ts
          # A collection MEMBER covers its shows. channelBuckets deduped members against the
          # rule pool by BUCKET ratingKey and a collection's is its own, so its children stayed
          # in the pool as standalone shows too — it played them both ways at once, the
          # collection in order and the same shows again at random.
          "$TSX" e2e/collection-covers-its-shows-test.ts
          # PENDING is a SUBTRACTION, and the subtraction is the feature: pool rules,
          # queue entries, a named collection's children, the watermark, per-item
          # dismissals. Hermetic — both Plex reads are parameters.
          "$TSX" e2e/pending-test.ts
          "$TSX" e2e/resume-on-advance-test.ts

      # Narrow-view layout gate — ALWAYS runs, unlike the Plex-gated browser suites below.
      #
      # It needs a browser but NOT Plex: it drives the Play landing on the degraded
      # no-Plex path and measures `documentElement.scrollWidth`. That measurement is the
      # only thing that catches the class of bug it guards — the 2026-08-10 narrow-view
      # horizontal scroll passed typecheck, the unit tests, the build and all seventeen
      # Playwright suites, because every one of them asserts behaviour and none asserts
      # geometry. Putting it in the PLEX_TOKEN-gated step below would mean it never runs:
      # the secret is unset, so that step is skipped on every PR today.
      #
      # Cost: ~1 min for the chromium download. If that is judged too expensive, move this
      # step's `"$TSX" e2e/narrow-scroll-test.ts` into the gated loop below and accept that
      # the gate only fires when the secret is present.
      - name: Narrow-view horizontal-scroll gate (browser, no Plex needed)
        # Tighter than the job, because this is where the browser install lives and where
        # every one of the 2026-08-19 stalls happened. A failure here names the step.
        timeout-minutes: 15
        env:
          QUEUES_PATH: /tmp/queues-narrow.yaml
          SETS_PATH: /tmp/sets-narrow.yaml
          HISTORY_PATH: /tmp/.history-narrow.json
          WEB_PORT: '18769'
        run: |
          unset MQTT_HOST MQTT_PORT MQTT_USER MQTT_PASS
          cp e2e/fixtures/queues.fixture.yaml /tmp/queues-narrow.yaml
          "$TSX" server/src/index.ts >/tmp/narrow-e2e.log 2>&1 &
          SRV=$!; sleep 1.5
          "$TSX" e2e/narrow-scroll-test.ts; rc=$?
          kill $SRV 2>/dev/null || true; wait $SRV 2>/dev/null || true
          exit $rc

      # Drag stability — ALWAYS runs, for the same reason as the narrow-view gate: the
      # PLEX_TOKEN-gated browser suites are skipped on every PR, and `homedrag-test` /
      # `ui-test` live there. Neither would have caught this anyway.
      #
      # Every symptom of the bug is in the TIME domain. A janky drag and a smooth one produce
      # the same final order, the same saved YAML and the same still screenshot — what differs
      # is the PATH the tile takes, so this records its index over time and counts direction
      # reversals. Against the unfixed code: 17 reversals, 22 re-inserts, 196 style writes for
      # one drag. After: 0, 2 and 16.
      #
      # Reuses the chromium the narrow-view step installed — keep it AFTER that step.
      - name: Drag stability (browser, no Plex needed)
        env:
          QUEUES_PATH: /tmp/queues-drag.yaml
          SETS_PATH: /tmp/sets-drag.yaml
          HISTORY_PATH: /tmp/.history-drag.json
          WEB_PORT: '18777'
        run: |
          unset MQTT_HOST MQTT_PORT MQTT_USER MQTT_PASS
          cp e2e/fixtures/queues.fixture.yaml /tmp/queues-drag.yaml
          cp e2e/fixtures/sets.fixture.yaml /tmp/sets-drag.yaml
          "$TSX" server/src/index.ts >/tmp/drag-e2e.log 2>&1 &
          SRV=$!; sleep 1.5
          "$TSX" e2e/drag-stability-test.ts; rc=$?
          kill $SRV 2>/dev/null || true; wait $SRV 2>/dev/null || true
          exit $rc

      # Path routing: the client router and the server's SPA fallback, pinned together.
      # ALWAYS runs, like the narrow-view gate above and for the same reason — the
      # PLEX_TOKEN-gated suites below are skipped on every PR, so a routing regression
      # would otherwise reach main unchallenged. It needs no token (URLs and header chrome
      # render on the degraded no-Plex path) and reuses the chromium the step above
      # installed, so keep it AFTER that step.
      #
      # What it exists to catch: `hasSpaFallback` reads like tidiness and was deliberately
      # `false` for the whole hash-routing era. Flip it back and lint, typecheck, the unit
      # tests, the build and every other suite stay green — the app just 404s on every
      # reload of a deep link.
      - name: Path routing + SPA fallback (browser, no Plex needed)
        timeout-minutes: 15
        env:
          QUEUES_PATH: /tmp/queues-routing.yaml
          SETS_PATH: /tmp/sets-routing.yaml
          HISTORY_PATH: /tmp/.history-routing.json
          WEB_PORT: '18770'
        run: |
          unset MQTT_HOST MQTT_PORT MQTT_USER MQTT_PASS
          cp e2e/fixtures/queues.fixture.yaml /tmp/queues-routing.yaml
          "$TSX" server/src/index.ts >/tmp/routing-e2e.log 2>&1 &
          SRV=$!; sleep 1.5
          "$TSX" e2e/routing-test.ts; rc=$?
          kill $SRV 2>/dev/null || true; wait $SRV 2>/dev/null || true
          exit $rc

      # The pick.ts <-> SelectListbox contract — browser, no Plex, no app
      # server. Every picker is a Charcuterie `Listbox` behind a button, and
      # `e2e/pick.ts` is how all seventeen browser suites drive one; but those
      # suites are all in the PLEX_TOKEN-gated step below, which is skipped on
      # every PR. So the contract that replaced `selectOption()` had NO
      # coverage on a pull request, and the 2026-08-13 Picker migration had to
      # be verified by hand. This step is that verification made permanent.
      #
      # Runs a `vite` dev server on its own port against a dependency-free
      # harness page (web/e2e-harness/) that mounts the real component. The
      # page is dev-only: vite.config.ts names one build entry, so it is not
      # in dist/. Reuses the chromium the narrow-view step above installed —
      # keep it AFTER that step.
      - name: pick.ts picker contract (browser, no Plex needed)
        run: $TSX e2e/pick-contract-test.ts

      # The pool editor must not blank the lists it renders no control for. It spawns its
      # own server against an unroutable Plex, and its assertions are all `GET /api/sets`
      # reads of sets.yaml — so it belongs here in the always-on block rather than in the
      # PLEX_TOKEN-gated one below, which is skipped on every PR. That placement is the
      # point: the bug it pins shipped BECAUSE the suites that drive this editor only run
      # when a secret happens to be present.
      - name: Pool editor keeps Blocked (browser, no Plex needed)
        run: $TSX e2e/pool-editor-keeps-blocked-test.ts

      # Drag-to-reorder on the Play landing. Browser and no Plex: the landing renders from
      # sets.yaml, and the claim is "the dragged order is what sets.yaml ends up holding".
      # Its sharpest assertion is the one about the row it did NOT drag — `PATCH
      # /api/sets-order` appends anything it was not told about, so a shelf-only list would
      # sweep every other set to the end of the file.
      - name: Play landing reorder (browser, no Plex needed)
        run: $TSX e2e/play-reorder-test.ts

      # Browser e2e (Playwright) — GATED on the PLEX_TOKEN secret. These suites
      # import chromium from `e2e/playwright.ts` and drive a Chromium browser,
      # and the shared server they hit talks to Plex. We can't call e2e/run.sh
      # directly (it `source`s the sandbox-only /mnt/.../agentic/.env), so we
      # replicate its per-suite loop inline: fresh server + fixture files per
      # suite. Playwright is installed at the repo ROOT because that is the first
      # entry in `e2e/playwright.ts`'s lookup list — it resolves the package at
      # runtime through `createRequire`, so it is never a typecheck dependency
      # (the `e2e typecheck` step above runs long before this install).
      - name: Browser e2e (Playwright, gated on PLEX_TOKEN secret)
        if: env.PLEX_TOKEN != ''
        env:
          QUEUES_PATH: /tmp/queues-ui.yaml
          SETS_PATH: /tmp/sets-ui.yaml
          WEB_PORT: '18768'
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        run: |
          # suites assert the degraded no-broker path — keep MQTT unset
          unset MQTT_HOST MQTT_PORT MQTT_USER MQTT_PASS
          fail=0
          for t in kbd-undo-test ui-test homedrag-test channels-test sse-test; do
            echo "=== $t ==="
            rm -rf /tmp/sets-ui.yaml /tmp/sets-ui.yaml.lock /tmp/queues-ui.yaml.lock /tmp/.history.json
            cp e2e/fixtures/queues.fixture.yaml /tmp/queues-ui.yaml
            "$TSX" server/src/index.ts >/tmp/web-e2e.log 2>&1 &
            SRV=$!; sleep 1.5
            "$TSX" "e2e/$t.ts" || fail=$((fail+1))
            kill $SRV 2>/dev/null || true; wait $SRV 2>/dev/null || true
          done
          echo "browser suites failed: $fail"; exit $fail
